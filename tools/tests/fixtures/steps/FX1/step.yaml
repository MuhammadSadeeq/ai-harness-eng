module: FX1
number: 1
title: A fixture step that runs tests through subprocess
goal: Run the tests with subprocess.run, answer a prompt, and edit a module between
  two runs.
lines_after: 20
chunks:
- id: 1a
  title: Start the file
  explain: The whole fixture file.
  hunks:
  - where: new code
    diff: '+import subprocess

      +import sys

      +from pathlib import Path

      +

      +

      +def run_command(command):

      +    done = subprocess.run(command, shell=True, cwd="demo", capture_output=True,
      text=True, timeout=60)

      +    return f"exit code {done.returncode}\n{(done.stdout + done.stderr).strip()
      or ''(no output)''}"

      +

      +

      +argv = sys.argv[1:]

      +if argv[0] == "edit-then-test":

      +    print(run_command("python test_calc.py"))

      +    Path("demo/calc.py").write_text("def add(a, b):\n    return a - b\n")

      +    print(run_command("python test_calc.py"))

      +elif argv[0] == "ask":

      +    answer = input("allow run_command? [y/N] ")

      +    print("allowed" if answer.strip().lower() == "y" else "denied")

      +else:

      +    print(run_command(argv[0]))

      '
checkpoint:
  argv:
  - python test_calc.py
  setup:
  - project
  expected: 'exit code 0

    1 passed

    '
  explain: The test passes.
