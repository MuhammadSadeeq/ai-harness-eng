- id: "anthropic.ctx-attention-budget"
  claim: "Anthropic describes LLMs as having an attention budget that they draw on when parsing large volumes of context."
  source: "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"
  quote: "Like humans, who have limited working memory capacity, LLMs have an “attention budget” that they draw on when parsing large volumes of context."
  verified_on: 2026-10-10
  volatility: "stable"
  kind: "docs"

- id: "anthropic.ctx-context-rot"
  claim: "Anthropic describes context rot: recall accuracy decreases as the number of tokens in the context window increases."
  source: "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"
  quote: "Studies on needle-in-a-haystack style benchmarking have uncovered the concept of context rot: as the number of tokens in the context window increases, the model’s ability to accurately recall information from that context decreases."
  verified_on: 2026-10-10
  volatility: "stable"
  kind: "docs"

- id: "anthropic.ctx-definition"
  claim: "Anthropic defines context engineering as curating and maintaining the optimal set of tokens during LLM inference."
  source: "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"
  quote: "Context engineering refers to the set of strategies for curating and maintaining the optimal set of tokens (information) during LLM inference, including all the other information that may land there outside of the prompts."
  verified_on: 2026-10-10
  volatility: "stable"
  kind: "docs"

