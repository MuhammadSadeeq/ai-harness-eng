- id: "anthropic.harn-initializer-agent"
  claim: "Anthropic's initializer agent runs the first session with a specialized prompt that sets up the environment, including init.sh, a progress log file and an initial git commit."
  source: "https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents"
  quote: "Initializer agent: The very first agent session uses a specialized prompt that asks the model to set up the initial environment: an init.sh script, a claude-progress.txt file that keeps a log of what agents have done, and an initial git commit that shows what files were added."
  verified_on: 2026-10-10
  volatility: "stable"
  kind: "docs"

- id: "anthropic.harn-progress-file"
  claim: "Anthropic says the claude-progress.txt file, alongside git history, lets a fresh agent quickly understand the state of work."
  source: "https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents"
  quote: "The key insight here was finding a way for agents to quickly understand the state of work when starting with a fresh context window, which is accomplished with the claude-progress.txt file alongside the git history."
  verified_on: 2026-10-10
  volatility: "stable"
  kind: "docs"

