- id: "anthropic.ctx-context-rot"
  claim: "Anthropic describes context rot: recall accuracy decreases as the number of tokens in the context window increases."
  source: "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"
  quote: "Studies on needle-in-a-haystack style benchmarking have uncovered the concept of context rot: as the number of tokens in the context window increases, the model’s ability to accurately recall information from that context decreases."
  verified_on: 2026-10-10
  volatility: "stable"
  kind: "docs"

