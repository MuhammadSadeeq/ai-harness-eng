- id: "harnesses.cc-permission-modes"
  claim: "The docs name Claude Code's permission modes default, acceptEdits, plan, auto, dontAsk and bypassPermissions, and give what each runs without asking."
  source: "https://code.claude.com/docs/en/permission-modes"
  source_alt: "https://code.claude.com/docs/en/permission-modes.md"
  quote: "| `default` | Reads only | Reviewing every action yourself, sensitive work | | [`acceptEdits`](#auto-approve-file-edits-with-acceptedits-mode) | Reads, file edits, and common filesystem commands (`mkdir`, `touch`, `mv`, `cp`, etc.) | Iterating on code you're reviewing | | [`plan`](#analyze-before-you-edit-with-plan-mode) | Reads, plus classifier-approved commands when [auto mode](#eliminate-prompts-with-auto-mode) is available | Exploring a codebase before changing it | | [`auto`](#eliminate-prompts-with-auto-mode) | Everything, with background safety checks | Long tasks, reducing prompt fatigue | | [`dontAsk`](#allow-only-pre-approved-tools-with-dontask-mode) | File reads inside your working directories and pre-approved tools; anything that would prompt is denied | Locked-down CI and scripts | | [`bypassPermissions`](#skip-all-checks-with-bypasspermissions-mode) | Everything | Isolated containers and VMs only |"
  verified_on: 2026-10-11
  volatility: "volatile"
  kind: "docs"

- id: "harnesses.cc-plan-mode"
  claim: "The docs say plan mode tells Claude to research and propose changes without making them: Claude reads files and runs shell commands to explore, writes a plan, and does not edit the source; edits stay blocked until the plan is approved, except in interactive terminal sessions with bypass permissions available."
  source: "https://code.claude.com/docs/en/permission-modes"
  source_alt: "https://code.claude.com/docs/en/permission-modes.md"
  quote: "Plan mode tells Claude to research and propose changes without making them. Claude reads files, runs shell commands to explore, and writes a plan, but does not edit your source. Except in interactive terminal sessions with [bypass permissions available](#skip-all-checks-with-bypasspermissions-mode), edits stay blocked until you approve the plan."
  verified_on: 2026-10-11
  volatility: "volatile"
  kind: "docs"

