- id: "harnesses.codex-approval-modes"
  claim: "Codex's approval policy values are untrusted, on-request and never: untrusted requires approval for commands unless an exec policy rule allows them, on-request lets the model decide when to ask the user, and never does not ask the user to approve commands."
  source: "https://github.com/openai/codex/blob/092d3acd6bec3e3a14bdc7e7a2810ab628ab759d/codex-rs/protocol/src/protocol.rs"
  source_alt: "https://raw.githubusercontent.com/openai/codex/092d3acd6bec3e3a14bdc7e7a2810ab628ab759d/codex-rs/protocol/src/protocol.rs"
  quote: "#[serde(rename_all = \"kebab-case\")] #[strum(serialize_all = \"kebab-case\")] pub enum AskForApproval { Internal policy for projects marked untrusted. Commands require approval unless an explicit exec policy rule allows them. #[serde(rename = \"untrusted\")] #[strum(serialize = \"untrusted\")] UnlessTrusted, The model decides when to ask the user for approval. #[serde(alias = \"on-failure\")] #[default] OnRequest, Fine-grained controls for individual approval flows. When a field is `true`, commands in that category are allowed. When it is `false`, those requests are automatically rejected instead of shown to the user. #[strum(serialize = \"granular\")] Granular(GranularApprovalConfig), Never ask the user to approve commands. Failures are immediately returned to the model, and never escalated to the user for approval. Never,"
  verified_on: 2026-10-11
  volatility: "stable"
  kind: "docs"
  note: "Read at tag rust-v0.162.1 (commit 092d3acd6bec3e3a14bdc7e7a2810ab628ab759d) from the openai/codex repository, which is the vendor's own source. The product docs on developers.openai.com are denied (D-052), and the repository's docs/ files only link to them. Quote is the AskForApproval enum with its doc comments; line breaks and doc markers collapsed. The repository's prompt template codex-rs/prompts/templates/permissions/approval_policy/unless_trusted.md names this mode \"unless-trusted\", which disagrees with the serde name \"untrusted\"; the fact uses the enum's name."

