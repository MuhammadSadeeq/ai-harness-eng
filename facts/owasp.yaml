- id: "owasp.llm06-2026-definition"
  claim: "LLM06:2026 Unbounded Consumption covers excessive, uncontrolled inference that enables service disruption, financial cost or model cloning."
  source: "https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/9253e38ade58e959b531c0c5c9a4842272c9cd0e/2026/final/LLM06_UnboundedConsumption.md"
  quote: "Unbounded Consumption occurs when an LLM application allows excessive and uncontrolled inferences, enabling attackers to disrupt service availability, inflict unsustainable financial costs, or steal intellectual property through model cloning, all by exploiting a common class of vulnerability: the absence of adequate controls over how resources are consumed."
  verified_on: 2026-10-10
  volatility: "volatile"
  kind: "spec"

