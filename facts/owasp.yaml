- id: "owasp.llm01-2025-definition"
  claim: "In the 2025 edition LLM01:2025 Prompt Injection was defined as user prompts altering LLM behaviour or output in unintended ways."
  source: "https://github.com/OWASP/www-project-top-10-for-large-language-model-applications/blob/99f4395589bdbd120ae961f9cd179e79d7f9b27f/2_0_vulns/LLM01_PromptInjection.md"
  quote: "A Prompt Injection Vulnerability occurs when user prompts alter the LLM’s behavior or output in unintended ways."
  verified_on: 2026-10-10
  volatility: "volatile"
  kind: "spec"

- id: "owasp.llm01-2026-definition"
  claim: "LLM01:2026 Prompt Injection defines a prompt-injection vulnerability as input that alters model behaviour in ways the developer did not intend, including via retrieved content, tool output and persistent memory."
  source: "https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/9253e38ade58e959b531c0c5c9a4842272c9cd0e/2026/final/LLM01_PromptInjection.md"
  quote: "A **prompt-injection vulnerability** occurs when input to a large language model (LLM), whether direct user input, retrieved content, tool output, image, audio, or video content, intermediate reasoning, or persistent memory, alters the model's behavior in ways the application developer did not intend."
  verified_on: 2026-10-10
  volatility: "volatile"
  kind: "spec"

- id: "owasp.llm03-2026-agentic-mapping"
  claim: "The 2026 LLM03 entry maps Excessive Agency in agentic systems to ASI02, ASI03 and ASI08."
  source: "https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/9253e38ade58e959b531c0c5c9a4842272c9cd0e/2026/final/LLM03_ExcessiveAgency.md"
  quote: "Within the context of agentic systems, Excessive Agency can manifest as ASI02: Tool Misuse & Exploitation, ASI03: Identity & Privilege Abuse and ASI08: Cascading Failures."
  verified_on: 2026-10-10
  volatility: "volatile"
  kind: "spec"

- id: "owasp.llm03-2026-definition"
  claim: "LLM03:2026 Excessive Agency defines the vulnerability as damaging actions performed in response to unexpected, ambiguous or manipulated LLM outputs, whatever the cause."
  source: "https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/9253e38ade58e959b531c0c5c9a4842272c9cd0e/2026/final/LLM03_ExcessiveAgency.md"
  quote: "Excessive Agency is the vulnerability that enables damaging actions to be performed in response to unexpected, ambiguous or manipulated outputs from an LLM, regardless of what is causing the LLM to malfunction."
  verified_on: 2026-10-10
  volatility: "volatile"
  kind: "spec"

