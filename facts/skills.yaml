- id: "skills.progressive-disclosure"
  claim: "The Agent Skills spec describes progressive disclosure: agents load skills progressively, adding detail only as a task requires it."
  source: "https://github.com/agentskills/agentskills/blob/69ef37e9424c0a7ea9dd2293b559e43ec8176379/docs/specification.mdx"
  quote: "Agents load skills *progressively*, pulling in more detail only as a task calls for it."
  verified_on: 2026-10-10
  volatility: "volatile"
  kind: "spec"

- id: "skills.progressive-tier1"
  claim: "Under progressive disclosure, the name and description of every skill are loaded at startup (about 100 tokens)."
  source: "https://github.com/agentskills/agentskills/blob/69ef37e9424c0a7ea9dd2293b559e43ec8176379/docs/specification.mdx"
  quote: "1. **Metadata** (~100 tokens): The `name` and `description` fields are loaded at startup for all skills"
  verified_on: 2026-10-10
  volatility: "volatile"
  kind: "spec"

- id: "skills.required-description"
  claim: "The description field is required, with a maximum of 1024 characters, and describes what the skill does and when to use it."
  source: "https://github.com/agentskills/agentskills/blob/69ef37e9424c0a7ea9dd2293b559e43ec8176379/docs/specification.mdx"
  quote: "| `description` | Yes | Max 1024 characters. Non-empty. Describes what the skill does and when to use it. |"
  verified_on: 2026-10-10
  volatility: "volatile"
  kind: "spec"

- id: "skills.required-name"
  claim: "The name field is required, at most 64 characters, and limited to lowercase letters, numbers and hyphens."
  source: "https://github.com/agentskills/agentskills/blob/69ef37e9424c0a7ea9dd2293b559e43ec8176379/docs/specification.mdx"
  quote: "| `name` | Yes | Max 64 characters. Lowercase letters, numbers, and hyphens only. Must not start or end with a hyphen. |"
  verified_on: 2026-10-10
  volatility: "volatile"
  kind: "spec"

- id: "skills.spec-frontmatter"
  claim: "The Agent Skills specification requires SKILL.md to contain YAML frontmatter followed by Markdown content."
  source: "https://github.com/agentskills/agentskills/blob/69ef37e9424c0a7ea9dd2293b559e43ec8176379/docs/specification.mdx"
  quote: "The `SKILL.md` file must contain YAML frontmatter followed by Markdown content."
  verified_on: 2026-10-10
  volatility: "volatile"
  kind: "spec"
