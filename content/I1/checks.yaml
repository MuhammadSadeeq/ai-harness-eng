- id: I1-c1
  objective: I1.o1
  mode: check
  question: "A posting is titled applied AI engineer, but its duties are sandboxing and tracing. Which should you believe?"
  options:
    - text: "The duties. A title can be used for many kinds of work."
      why: "Right. The course's advice is to read the duties first, because the title does not say what the work is."
    - text: "The title, because titles name the work."
      why: "Wrong. The title is the first thing a posting says, but it does not describe the work by itself."
    - text: "Neither, so skip the posting."
      why: "Tempting. The duties still tell you the work, so the posting is worth reading."
  answer: 0

- id: I1-c2
  objective: I1.o3
  mode: check
  question: "Labs look for building, measuring and debugging, shown in public. Which evidence fits best?"
  options:
    - text: "A repository with tests, and a results table linked from a write-up."
      why: "Right. It shows the building, the measuring and the explanation, and a reviewer can check each one."
    - text: "A certificate from a short online course."
      why: "Wrong. A certificate shows you finished a course. It does not show that you built or measured anything."
    - text: "A long list of tools on a résumé."
      why: "Wrong. A list shows exposure to tools, not results from using them."
  answer: 0
