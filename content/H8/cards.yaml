- id: H8-k1
  type: term
  objective: H8.o1
  front: What does the turn guard end the run with, and what does it record?
  back: The max_turns status. It writes a guard line with the limit and the turn count first.
- id: H8-k2
  type: term
  objective: H8.o1
  front: What does the token budget guard compare, and when?
  back: The input and output tokens spent so far against the budget, before each new call.
- id: H8-k3
  type: term
  objective: H8.o1
  front: What does the loop detector do on the third identical call?
  back: It answers with an error and does not run the call, so the model is told to try something else.
- id: H8-k4
  type: term
  objective: H8.o1
  front: When does the loop guard end the run?
  back: When the model repeats the same call after the redirect. The run ends with the loop status.
- id: H8-k5
  type: term
  objective: H8.o2
  front: What does close_open_calls() add after an interrupt?
  back: A tool result for every pending tool request, saying it was interrupted before it ran.
- id: H8-k6
  type: term
  objective: H8.o2
  front: Why must every tool request get a result?
  back: A request with no result right after it fails with the standard tool_use error, so the run cannot resume.
- id: H8-k7
  type: term
  objective: H8.o3
  front: What does the interrupt tape show?
  back: An interrupt after an edit leaves a tool request with no result, and the next prompt is rejected.
- id: H8-k8
  type: term
  objective: H8.o1
  front: What does the time guard compare, and on which clock?
  back: The clock's time since the run began, against --max-seconds, before each model call. Under --fake the clock
    moves only by the waits.
