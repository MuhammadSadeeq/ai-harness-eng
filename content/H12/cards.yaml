- id: H12-k1
  type: term
  objective: H12.o1
  front: What does a checkpoint become in H12?
  back: 'An automated test: its step runs in a temp folder, and its transcript must match the expected output.'
- id: H12-k2
  type: term
  objective: H12.o2
  front: What does python -m rein run do?
  back: It runs one trial, scripted or live, and prints the events as JSON lines.
- id: H12-k3
  type: term
  objective: H12.o3
  front: What does --max-cost-usd do on a live run?
  back: It caps the spend. Before each request the run checks that the request cannot pass the cap, and stops with
    status budget if it could.
- id: H12-k4
  type: term
  objective: H12.o3
  front: Where does a live run's API key come from?
  back: From ANTHROPIC_API_KEY only. No command takes it as an argument, and no output, trace or file contains it.
- id: H12-k5
  type: term
  objective: H12.o4
  front: What is a baseline?
  back: The version you compare the change against, run on the same tasks, seeds and board, without the change.
- id: H12-k6
  type: term
  objective: H12.o3
  front: What does a Wilson 95% interval tell you about a pass count?
  back: How sure you can be about the rate. It is wide when there are few trials, so 10 of 10 is not a proof.
- id: H12-k7
  type: term
  objective: H12.o5
  front: Why label a number scripted?
  back: A scripted run repeats exactly, and a real model's numbers vary. The label says which one you are reading
    (D-038).
