- id: H7-k1
  type: term
  objective: H7.o1
  front: What does sleep() do on the virtual clock?
  back: It moves the clock forward by the wait and returns at once. Nothing waits in real time.
- id: H7-k2
  type: term
  objective: H7.o1
  front: What is jitter for, and why is it seeded under --fake?
  back: Jitter spreads the retries of clients that failed together. Under --fake the random source is seeded, so
    the same waits come out on every run.
- id: H7-k3
  type: term
  objective: H7.o1
  front: What does with_retries() wait after the first failure?
  back: About half a second, scaled by a random share between half and all of it. Then one second, then two, never
    above the cap.
- id: H7-k4
  type: term
  objective: H7.o2
  front: What does CircuitBreaker count?
  back: Failed calls in a row. A successful call resets the count to zero.
- id: H7-k5
  type: term
  objective: H7.o2
  front: When does the breaker open, and how does the run end?
  back: After three failed calls in a row. The run ends with the status circuit_open.
- id: H7-k6
  type: term
  objective: H7.o2
  front: What does the trace record for an outage?
  back: A model_error line for each failed call, a retry_wait line for each wait, and a breaker line when the breaker
    opens.
- id: H7-k7
  type: term
  objective: H7.o3
  front: What does the outage tape show about fixed waits?
  back: Calls arrive together every time, and the outage lasts longer. Backoff with jitter and a breaker stop sending
    the calls into it.
