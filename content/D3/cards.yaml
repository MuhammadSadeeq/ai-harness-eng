- id: D3-k1
  type: term
  objective: D3.o1
  front: "When does a regression eval block a change in CI?"
  back: "When the new interval sits fully below the old one's. A drop of a few points inside the noise is not a regression."

- id: D3-k2
  type: term
  objective: D3.o2
  front: "What is calibration?"
  back: "Checking a model grader against human labels you trust: how often the two agree, and which way the grader errs."

- id: D3-k3
  type: term
  objective: D3.o2
  front: "Why is an agreement rate not enough?"
  back: "It does not say which way the errors fall. Count the false passes and the false fails apart."

- id: D3-k4
  type: term
  objective: D3.o3
  front: "What is contamination?"
  back: "A test case the model saw while learning or tuning, so the score measures memory, not the task."

- id: D3-k5
  type: term
  objective: D3.o3
  front: "How do you reduce contamination and eval awareness?"
  back: "Keep a held-out set you never tune on, and do not announce which runs are tests."

- id: D3-k6
  type: term
  objective: D3.o4
  front: "What is the first sign of a grader passing work for the wrong reason?"
  back: "The reply says done while the file's check fails. Read the reply next to the file."
