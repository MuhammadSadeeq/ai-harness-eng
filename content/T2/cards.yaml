- id: T2-k1
  type: term
  objective: T2.o1
  front: "What does calling an async def function return?"
  back: "A coroutine. Its body has not run yet, as the first example shows."
- id: T2-k2
  type: term
  objective: T2.o1
  front: "What does await give you when the coroutine returns 8?"
  back: "The value 8. The second example awaits double and returns what it gives."
- id: T2-k3
  type: term
  objective: T2.o2
  front: "What does fetch_all pass to asyncio.gather?"
  back: "One fetch coroutine per job, in the order of jobs."
- id: T2-k4
  type: term
  objective: T2.o2
  front: "Where does the timeout go?"
  back: "In asyncio.wait_for, around the gather call. A TimeoutError from it reaches the caller."
- id: T2-k5
  type: term
  objective: T2.o2
  front: "How do the tests check that the jobs overlap?"
  back: "They time three jobs of 0.2 s each and expect less than 0.4 s in total."
