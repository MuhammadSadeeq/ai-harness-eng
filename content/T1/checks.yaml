- id: T1-c1
  objective: T1.o1
  mode: check
  question: "What does this hint allow? def label(count: int | None) -> str"
  options:
    - text: "Only an int"
      why: "Too narrow. The | None part also allows None."
    - text: "An int, or None"
      why: "Right. The union of int and None is what the hint says."
    - text: "Any value at all"
      why: "Too wide. The hint names two types."
    - text: "A string"
      why: "No. Neither int nor None is a string."
  answer: 1
