  front: "What does int | None mean in a hint?"
  back: "The value is an int, or None."
- id: T1-k2
  type: term
  objective: T1.o1
  front: "Where does a type hint go on a function?"
  back: "After each parameter name, and after the arrow for the return type."
- id: T1-k3
