- id: extended-thinking
  term: extended thinking
  aliases: [extended thinking]
  strict: true
  wire: loop
  definition: "The tokens the model uses while it thinks before it answers. They are billed as output tokens."
  fact: api.thinking-billed-as-output

- id: thinking-block
  term: thinking block
  aliases: [thinking block, thinking blocks]
  strict: true
  wire: loop
  definition: "A thinking block from an assistant turn. During tool use it must go back complete and unmodified, alongside the tool_use block."
  fact: api.thinking-blocks-pass-back-tool-use

- id: effort
  term: effort
  aliases: [effort]
  strict: false
  wire: control
  definition: >-
    A setting that tells the model how much to work before it answers. The harness sets it on each request.

- id: cost-per-completed-task
  term: cost per completed task
  aliases: [cost per completed task]
  strict: true
  wire: observe
  definition: >-
    The cost of a task's calls, divided by the share of tasks that finish. A cheap call that often fails is not cheap.
