- id: plan-mode
  term: plan mode
  aliases:
  - plan mode
  - plan modes
  strict: true
  wire: control
  definition: 'In Claude Code, plan mode is a permission mode: Claude explores and writes a plan, and does not edit
    the source until the plan is approved, except in interactive terminal sessions with bypass permissions available.'
- id: auto-mode
  term: auto mode
  aliases:
  - auto mode
  - auto modes
  strict: true
  wire: permissions
  definition: In Claude Code, auto is a permission mode that lets everything run without asking, with background
    safety checks.
