- id: C4-k1
  type: term
  objective: C4.o1
  front: What is a cache prefix?
  back: "The part of a request up to and including the block marked for caching. A cache hit needs all of that part to be identical."
  fact: api.cache-prefix-whole-match
- id: C4-k2
  type: order-turn
  objective: C4.o2
  front: Put the parts of a request in the order the cache reads them.
  items:
  - Tool definitions
  - System prompt
  - Earlier messages
  - The new message
  back: 'Stable first, changing last: the tools, then the system prompt, then the messages, with the new message at the end.'
- id: C4-k3
  type: term
  objective: C4.o3
  front: What is cache invalidation?
  back: "A change at one level invalidates that level and every level after it: tools, then system, then messages."
  fact: api.cache-invalidation-hierarchy
- id: C4-k4
  type: term
  objective: C4.o4
  front: "What does a cache hit cost, against base input, on Sonnet 5.5?"
  back: "On Sonnet 5.5, a cache hit costs $0.10 per million tokens. Base input costs $2 per million tokens."
  fact: models.sonnet-5-5-price
- id: C4-k5
  type: term
  objective: C4.o4
  front: What is a cache hit rate?
  back: "Cache read tokens divided by all input tokens. The usage reports cache reads, cache writes and the uncached input as separate counts."
  fact: api.cache-usage-fields
- id: C4-k6
  type: term
  objective: C4.o1
  front: What is a cache breakpoint?
  back: The point up to which a request asks to be cached. The course's model uses one, at the end of the request.
- id: C4-k7
  type: term
  objective: C4.o3
  front: Which block breaks a cache when it changes on every call?
  back: "A change at one level invalidates that level and every level after it, so a block that changes on every call misses from its own level on."
  fact: api.cache-invalidation-hierarchy
- id: C4-k8
  type: term
  objective: C4.o1
  front: What is a cache TTL?
  back: "The default cache TTL is five minutes."
  fact: api.cache-ttl-default-5m-and-1h
