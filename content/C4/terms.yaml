- id: prompt-caching
  term: prompt caching
  aliases:
  - prompt caching
  - prompt cache
  strict: true
  wire: context
  definition: "Reusing the work done on the start of a request when a later call starts the same way, so that start costs less."
  fact: models.cache-read-multiplier
- id: cache-prefix
  term: cache prefix
  aliases:
  - cache prefix
  - cache prefixes
  strict: true
  wire: context
  definition: "The part of a request up to and including the block marked for caching. A cache hit needs all of that part to be identical."
  fact: api.cache-prefix-whole-match
- id: cache-hit
  term: cache hit
  aliases:
  - cache hit
  - cache hits
  strict: true
  wire: context
  definition: "A call that reads some of its input from the cache."
  fact: api.cache-usage-fields
- id: cache-write
  term: cache write
  aliases:
  - cache write
  - cache writes
  strict: true
  wire: context
  definition: "Input that a call writes to the cache. The usage reports it as cache_creation_input_tokens."
  fact: api.cache-usage-fields
- id: cache-read
  term: cache read
  aliases:
  - cache read
  - cache reads
  strict: true
  wire: context
  definition: "Input that a call takes from the cache. The usage reports it as cache_read_input_tokens."
  fact: api.cache-usage-fields
- id: cache-breakpoint
  term: cache breakpoint
  aliases:
  - cache breakpoint
  - cache breakpoints
  strict: true
  wire: context
  definition: The point up to which a request asks to be cached. The course's model of caching uses one, at the end of the request.
- id: cache-ttl
  term: cache TTL
  aliases:
  - cache TTL
  - cache lifetime
  strict: true
  wire: context
  definition: "How long a cache entry lasts: by default five minutes, and each use of the cached content refreshes it at no extra cost."
  fact: api.cache-read-refreshes-ttl
- id: cache-invalidation
  term: cache invalidation
  aliases:
  - cache invalidation
  - invalidator
  - invalidates
  strict: true
  wire: context
  definition: "Cache order is tools, then system, then messages. A change at one level invalidates that level and every level after it."
  fact: api.cache-invalidation-hierarchy
