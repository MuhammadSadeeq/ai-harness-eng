- id: F6-k1
  type: term
  objective: F6.o1
  front: What does an environment contain?
  back: Tasks, a sandbox, tools, a grader and a reward. The grader turns a run into the reward.
- id: F6-k2
  type: term
  objective: F6.o3
  front: What is reward hacking?
  back: A run that earns the reward without solving the task. Editing the test that grades it is one way.
- id: F6-k3
  type: term
  objective: F6.o2
  front: What does a reset give you?
  back: The same starting state, so the next run begins from the same workspace and seeds.
- id: F6-k4
  type: term
  objective: F6.o3
  front: What closes a hack in the grader?
  back: 'Judge the work on what the policy cannot edit: a pristine copy of the tests and hidden cases.'
- id: F6-k5
  type: term
  objective: F6.o4
  front: Why does a training environment need a trusted grader more than an eval?
  back: Its reward trains the policy, so a gamed grader teaches the gaming.
- id: F6-k6
  type: term
  objective: F6.o5
  front: What is the first containment control?
  back: No network egress by default, and scoped credentials.
