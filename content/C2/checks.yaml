- id: C2-p1
  objective: C2.o4
  mode: predict
  question: "A tool returns a 40 KB log, and nothing caps it. What happens to the next prompt?"
  options:
    - text: "It fits, because the model reads the log in pieces."
      why: "Tempting. Nothing in this board reads in pieces. The whole log stays in the prompt."
    - text: "It is too big to send, and the run fails."
      why: "Right. The log comes back whole, and the prompt grows past the window."
    - text: "The model cuts the log to fit, and the run goes on."
      why: "Tempting. The model cannot cut what it has not been sent. The harness decides what it sees."
  answer: 1
  outcome: "The log came back whole. The next prompt was too big to send, and the run failed."

- id: C2-c1
  objective: C2.o1
  mode: check
  question: "Which statement about context rot is right?"
  options:
    - text: "Quality can fall well before the window is full."
      why: "Right. Anthropic describes context rot: recall accuracy decreases as the number of tokens in the context window increases."
      fact: anthropic.ctx-context-rot
    - text: "Quality stays the same until the window is full."
      why: "Wrong. Recall falls as the window fills, before the limit is reached."
    - text: "Context rot only happens at the hard limit."
      why: "Wrong. It happens as the window fills, not only at the limit."
  answer: 0

- id: C2-c2
  objective: C2.o2
  mode: check
  question: "An audit finds that tool definitions take more of the desk than the standing instructions. What is the first thing to ask?"
  options:
    - text: "Whether every tool definition is needed on this call."
      why: "Right. The audit points at the part that eats the budget, and the first lever is to not load what is not needed."
    - text: "Whether the window can be made bigger."
      why: "Tempting. A bigger window moves the edge, but the desk is still full of what is not needed."
    - text: "Whether the model should read the tools again."
      why: "Wrong. Reading again does not take anything off the desk."
  answer: 0

- id: C2-c3
  objective: C2.o3
  mode: check
  question: "Which lever comes first?"
  options:
    - text: "Don't load it."
      why: "Right. The first lever is to keep the material off the desk when the call does not need it."
    - text: "Shrink it."
      why: "Tempting. Shrinking comes second: first ask whether the material belongs on the desk at all."
    - text: "Summarize it."
      why: "Tempting. Summarizing comes last, because it can lose a detail."
  answer: 0

- id: C2-c4
  objective: C2.o4
  mode: check
  question: "A tool output is capped. What must the cap keep, and what must it say?"
  options:
    - text: "The start and the end, and how many characters were cut."
      why: "Right. The reader sees how the output begins and ends, and knows how much is missing."
    - text: "Only the start."
      why: "Wrong. A start alone hides the end, where the result often is."
    - text: "Nothing; cut silently to keep it short."
      why: "Wrong. A silent cut hides that anything was removed."
  answer: 0

