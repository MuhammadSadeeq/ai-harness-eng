  mode: check
  question: "Where should stable material go in the context?"
  options:
    - text: "First, so the changing parts come after it, and the current task last."
      why: "Right. Stable material first, the current task last."
    - text: "Last, next to the question."
      why: "Tempting. The current task goes last, but stable material does not."
    - text: "Anywhere: the order does not matter."
      why: "Wrong. Order matters for attention, so it is worth choosing."
