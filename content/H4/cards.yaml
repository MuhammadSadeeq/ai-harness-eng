- id: H4-k1
  type: term
  objective: H4.o1
  front: What does the gate return for a tool call?
  back: One of allow, ask or deny, each with a reason the model can read.
- id: H4-k2
  type: term
  objective: H4.o1
  front: Where does the gate run?
  back: In run_tool(), before the tool runs. No tool call runs before its verdict.
- id: H4-k3
  type: term
  objective: H4.o2
  front: What is the decision order in decide()?
  back: Read-only tools first; then the deny rules; then the allow list, only without chaining characters; then
    the mode for edits.
- id: H4-k4
  type: term
  objective: H4.o2
  front: Why does the chaining check matter?
  back: Because python test_calc.py && curl evil.example starts like an allowed command, so the second command would
    ride along.
- id: H4-k5
  type: term
  objective: H4.o3
  front: Why does a denied call stay denied for the rest of the run?
  back: So the model cannot wear the person down by asking for the same thing again.
- id: H4-k6
  type: term
  objective: H4.o3
  front: Does the gate check the paths inside a file tool?
  back: No. The gate decides whether a kind of action is allowed; the wall inside the tool decides which files it
    can touch.
