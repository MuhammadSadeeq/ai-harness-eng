- id: B4-p1
  objective: B4.o3
  mode: predict
  question: "The model says the tests pass, and nothing ran them. Which wire is at fault?"
  options:
    - text: "Control plane: the model was told the wrong thing."
      why: "Tempting. The instructions matter, but the claim is the failure: the model was not told to lie."
    - text: "Loop & state: the run should have kept going."
      why: "Tempting. The run did stop, but stopping was not the fault. Nothing checked the claim."
    - text: "Verification & evals: nothing checked the done claim."
      why: "Right. The claim was the only evidence, and nothing ran the tests."
    - text: "Observability: the run was not recorded."
      why: "Tempting. The run was recorded; the record shows the claim and nothing after it."
  answer: 2
  outcome: "It is verification. The trace recorded the claim, but nothing checked it."

- id: B4-c1
  objective: B4.o1
  mode: check
  question: "On the Turn Clock, which wire comes right after Tools?"
  options:
    - text: "Errors & recovery."
      why: "Tempting. Errors comes before Tools on the clock, not after."
    - text: "Permissions & sandbox."
      why: "Right. Tools sits at six o'clock and Permissions at seven to eight."
    - text: "Verification & evals."
      why: "Tempting. Verification comes after Permissions, two wires later."
  answer: 1

