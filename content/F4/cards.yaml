- id: F4-k1
  type: term
  objective: F4.o1
  front: "How do you compare two models on cost?"
  back: "Per completed task: the cost of every run divided by the runs that completed as a true done. Cost per call hides the failures."

- id: F4-k2
  type: term
  objective: F4.o2
  front: "What do you do before you measure a cut in cost?"
  back: "Predict its effect on cost per call and on cost per completed task. A cache hit lowers the first; only a steady success rate carries it to the second."

- id: F4-k3
  type: term
  objective: F4.o3
  front: "What is a budget guard?"
  back: "A check that stops a run when its token or cost budget is spent, and keeps the trace of what it did."

- id: F4-k4
  type: term
  objective: F4.o4
  front: "What is time to first token?"
  back: "The wait from sending a request to the first token of the reply. It is one part of latency, next to the time to generate the reply and the time tools take."

- id: F4-k5
  type: term
  objective: F4.o3
  front: "What is a latency budget?"
  back: "A limit on how long a task may take from start to end, set before you measure the work."

- id: F4-k6
  type: term
  objective: F4.o1
  front: "Why can a cheaper model cost more per completed task?"
  back: "Its runs cost less each, but fewer of them complete. The cost of the runs that fail is still paid, so it is spread over fewer successes."
