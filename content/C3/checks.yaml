- id: C3-p1
  objective: C3.o1
  mode: predict
  question: "The task has a constraint about a function's signature, and the compactor keeps no notes. What does the model see after the first compaction?"
  options:
    - text: "The constraint, because it was in the task."
      why: "Tempting. The task is among the messages the compaction replaces, and the summary keeps no notes."
    - text: "A summary that says nothing was kept, so the constraint is gone."
      why: "Right. With an empty keep list, the summary holds no commitments, and the model cannot see the rule."
    - text: "The whole earlier conversation again."
      why: "Wrong. Compaction replaces the earlier messages with the summary; it does not restore them."
  answer: 1
  outcome: "The first compaction kept nothing. The constraint left the request, and the model renamed the function."

- id: C3-c1
  objective: C3.o1
  mode: check
  question: "What is the main failure of compaction?"
  options:
    - text: "It loses what matters: a commitment the summary did not keep."
      why: "Right. A summary keeps only what the compactor chose; the rest is gone for later calls."
    - text: "It makes the model learn from the run."
      why: "Tempting. Compaction changes the desk, not the weights. The model does not learn."
    - text: "It costs nothing."
      why: "Tempting. A compaction is harness work with a cost of its own: the next call builds a new prompt."
  answer: 0

- id: C3-c2
  objective: C3.o2
  mode: check
  question: "Which of these should a compactor drop?"
  options:
    - text: "Raw tool output."
      why: "Right. The commitments are kept as notes; the raw output is the bulk and can go."
    - text: "The goal."
      why: "Wrong. The goal is one of the commitments a compactor keeps."
    - text: "The file pointers."
      why: "Wrong. Pointers tell the model where the work is; they are kept."
  answer: 0

- id: C3-c3
  objective: C3.o3
  mode: check
  question: "A long run has drifted from its goal, and its window is nearly full. Which choice fits, and why?"
  options:
    - text: "Compact it, because a summary keeps the thread."
      why: "Tempting. A summary of a tangled thread keeps the tangle; a drifted run is clearer as a fresh start."
    - text: "A clean reset with a handoff note, because the goal is clearer as a fresh start and the note carries the commitments."
      why: "Right. The reset clears the drift, and the handoff note keeps the goal, the constraints and the progress."
    - text: "Keep running it, because the window still fits."
      why: "Wrong. A window that fits is not a run that is on track."
  answer: 1

- id: C3-c4
  objective: C3.o4
  mode: check
  question: "Which memory tier holds a project's standing conventions, read by every run in that project?"
  options:
    - text: "The window."
      why: "Tempting. The window holds what is on the desk for one call, not the standing facts."
    - text: "The project files."
      why: "Right. Standing facts about one repository live in its project files."
    - text: "The model's weights."
      why: "Wrong. Training sets the weights, and a run does not change them."
  answer: 1

- id: C3-c5
  objective: C3.o4
  mode: check
  question: "Memory means the model learns. Is that right?"
  options:
    - text: "Yes, every run teaches the model."
      why: "Tempting. A run does not change the weights; the harness keeps text for later runs."
    - text: "No. A memory tier is text the harness puts in front of the model or keeps for later."
      why: "Right. The model reads what it is sent; memory is what the harness keeps."
    - text: "Only the long-term store teaches it."
      why: "Wrong. The store is text too; no tier changes the weights."
  answer: 1
