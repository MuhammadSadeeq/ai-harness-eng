id: D2-wilson
module: D2
title: A 95% Wilson interval, and whether two results really differ
objectives: [D2.o2]
minutes: 25
hints:
  - "Use the Wilson score interval, not the normal approximation: it stays inside 0 and 1 and handles 0 and all passes."
  - "With p = passed / n and z = 1.959964, the centre is (p + z*z/(2n)) / (1 + z*z/n), and the half-width is z * sqrt(p(1-p)/n + z*z/(4n*n)) / (1 + z*z/n)."
  - "Two results differ only when their intervals do not overlap: one ends before the other starts. The gap between the two point estimates is not enough."
from_memory: false
wrong_solutions:
  - name: normal-approximation
    code: |

      import math

      Z = 1.959964


      def wilson(passed, n):
          p = passed / n
          half = Z * math.sqrt(p * (1 - p) / n)
          return (p - half, p + half)


      def differ(a, b):
          lo_a, hi_a = wilson(*a)
          lo_b, hi_b = wilson(*b)
          return hi_a < lo_b or hi_b < lo_a
  - name: differ-by-points
    code: |

      import math

      Z = 1.959964


      def wilson(passed, n):
          p = passed / n
          z2 = Z * Z
          denom = 1 + z2 / n
          centre = (p + z2 / (2 * n)) / denom
          half = Z * math.sqrt(p * (1 - p) / n + z2 / (4 * n * n)) / denom
          return (max(0.0, centre - half), min(1.0, centre + half))


      def differ(a, b):
          return abs(a[0] / a[1] - b[0] / b[1]) > 0.1
  - name: no-centre-shift
    code: |

      import math

      Z = 1.959964


      def wilson(passed, n):
          p = passed / n
          z2 = Z * Z
          half = Z * math.sqrt(p * (1 - p) / n + z2 / (4 * n * n)) / (1 + z2 / n)
          return (max(0.0, p - half), min(1.0, p + half))


      def differ(a, b):
          lo_a, hi_a = wilson(*a)
          lo_b, hi_b = wilson(*b)
          return hi_a < lo_b or hi_b < lo_a
