- name: sorted-order
  code: "def search(query, tools, loaded):\n    text = query if isinstance(query, str) else \"\"\n    words = text.lower().split()\n    if not words:\n        return f\"No tool matched: {text}\", False, []\n    def matches(tool):\n        haystack = f\"{tool['name']} {tool['description']}\".lower()\n        return all(word in haystack for word in words)\n    fresh = sorted(tool[\"name\"] for tool in tools if tool[\"name\"] not in loaded and matches(tool))\n    if fresh:\n        newly = fresh[:5]\n        return f\"Loaded: {', '.join(newly)}\", True, newly\n    old = [tool[\"name\"] for tool in tools if tool[\"name\"] in loaded and matches(tool)]\n    if old:\n        return f\"Already loaded: {', '.join(old)}\", True, []\n    return f\"No tool matched: {text}\", False, []\n"
