id: E1-trifecta
module: E1
title: Find the three legs in a tool set
objectives:
- E1.o2
minutes: 25
hints:
- 'Read test_kata.py. Each test names one case: no tools, one leg, two legs in one tool, all three, a cut leg, an
  unknown name.'
- Each tool lists its legs in its "trifecta" field. Collect the legs of every tool into one set, refuse a name that
  is not one of the three, then keep the three in the course's fixed order.
- 'Nearly the code: for each leg in LEGS, keep it when it is in the set and not in cut. lethal() is then whether
  all three are kept.'
from_memory: false
