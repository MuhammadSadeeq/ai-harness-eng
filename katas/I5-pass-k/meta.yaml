  - name: off-by-one-in-pass-at-k
    code: |
      import math


      def pass_k(rows, k):
          at_total = 0.0
          hat_total = 0.0
          for trials in rows:
              n = len(trials)
              c = sum(1 for passed in trials if passed)
              total = math.comb(n, k)
              at_total += 1 - math.comb(n - c, k - 1) / total
              hat_total += math.comb(c, k) / total
          return at_total / len(rows), hat_total / len(rows)
