  - name: pooled-trials
    code: |
      import math


      def pass_k(rows, k):
          at_total = 0.0
          hat_total = 0.0
          trials_total = 0
          for trials in rows:
              n = len(trials)
              c = sum(1 for passed in trials if passed)
              total = math.comb(n, k)
              at_total += (1 - math.comb(n - c, k) / total) * n
              hat_total += (math.comb(c, k) / total) * n
              trials_total += n
          return at_total / trials_total, hat_total / trials_total
  - name: k-ignored
    code: |
      import math


