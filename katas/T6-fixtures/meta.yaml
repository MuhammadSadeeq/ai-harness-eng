id: T6-fixtures
module: T6
title: Test a discount with a fixture and a list of cases
objectives:
- T6.o1
- T6.o2
minutes: 20
hints:
- Read test_kata.py. The fixture is a helper that builds the setup. The cases are one loop over a table.
- 'apply_discount: check the percent, then subtract price * percent // 100 from the price. cart_total adds the prices, then
  calls apply_discount once.'
- 'Nearly the code: if not 0 <= percent <= 100, raise ValueError. Return price_cents - price_cents * percent // 100. For cart_total,
  return apply_discount(sum(price for _, price in items), percent).'
from_memory: true
wrong_solutions:
- name: rounds-up
  code: "def apply_discount(price_cents: int, percent: int) -> int:\n    \"\"\"The price after a percent discount. The discount\
    \ rounds down, in cents.\"\"\"\n    if not 0 <= percent <= 100:\n        raise ValueError(f\"percent must be 0 to 100,\
    \ got {percent}\")\n    return price_cents - -(-price_cents * percent // 100)\n\n\ndef cart_total(items: list[tuple[str,\
    \ int]], percent: int) -> int:\n    \"\"\"The total of the items in cents, after one discount on the whole cart.\"\"\"\
    \n    return apply_discount(sum(price for _, price in items), percent)\n"
- name: no-range-check
  code: "def apply_discount(price_cents: int, percent: int) -> int:\n    \"\"\"The price after a percent discount. The discount\
    \ rounds down, in cents.\"\"\"\n    return price_cents - price_cents * percent // 100\n\n\ndef cart_total(items: list[tuple[str,\
    \ int]], percent: int) -> int:\n    \"\"\"The total of the items in cents, after one discount on the whole cart.\"\"\"\
    \n    return apply_discount(sum(price for _, price in items), percent)\n"
- name: ignores-discount
  code: "def apply_discount(price_cents: int, percent: int) -> int:\n    \"\"\"The price after a percent discount. The discount\
    \ rounds down, in cents.\"\"\"\n    if not 0 <= percent <= 100:\n        raise ValueError(f\"percent must be 0 to 100,\
    \ got {percent}\")\n    return price_cents - price_cents * percent // 100\n\n\ndef cart_total(items: list[tuple[str, int]],\
    \ percent: int) -> int:\n    \"\"\"The total of the items in cents, after one discount on the whole cart.\"\"\"\n    return\
    \ sum(price for _, price in items)\n"
