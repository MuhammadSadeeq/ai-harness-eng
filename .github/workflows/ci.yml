name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checkers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install tools
        run: |
          pip install -r requirements-dev.txt
          npm ci
      - name: Lint and types
        run: |
          ruff check tools site/assets/py
          mypy
      - name: Checker tests
        run: python -m pytest
      - name: Course, docs and generated data
        run: |
          python tools/render_curriculum.py --check
          python tools/check_content.py
          python tools/gen_data.py --check
          python tools/gen_pages.py --check
          node tools/fill_nums.mjs --check
          python tools/gen_glossary.py --check
      - name: JS unit tests (simulator, shell, store)
        run: node --test "site/assets/**/test/*.test.mjs"
      - name: Content checkers
        run: |
          python tools/check_facts.py
          python tools/check_snippets.py
          python tools/check_katas.py
          python tools/check_katas.py --pyodide
          python tools/check_steps.py
          python tools/check_steps.py --pyodide
          python tools/check_scenarios.py
          python tools/check_wire.py
      - name: Wire palette (color-vision thresholds)
        run: python tools/qa/check_palette.py
      - name: Fonts cover the site's text
        run: python tools/qa/check_fonts.py

  rein:
    name: Rein (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          # pyyaml: the tests read facts/*.yaml. The live extra pins the SDK, so mypy checks live.py against it.
          pip install pytest==9.1.1 ruff==0.16.9 mypy==2.3.1 pyyaml==6.0.3
          pip install -e "rein[live]"
      - name: Lint, types, tests
        working-directory: rein
        run: |
          ruff check .
          mypy
          python -m pytest

  qa:
    name: Browser QA
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Chromium for the pinned Playwright
        run: npx playwright install --with-deps chromium
      - name: Copy self-hosted Pyodide for the kata pages (D-015)
        run: node tools/vendor/copy_pyodide.mjs
      - name: Pages, widgets, accessibility, budgets, CVD screenshots
        run: node tools/qa/run.mjs --cvd
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: tools/qa/out/
          retention-days: 14
