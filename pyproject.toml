# Tooling config for the repository's own scripts (tools/). Rein has its own
# pyproject in rein/.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["source", "site/vendor", "node_modules", "tools/tests/fixtures", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["tools", "site/assets/py"]
exclude = ["tools/tests/fixtures/"]

[[tool.mypy.overrides]]
module = ["fontTools", "fontTools.*", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tools.tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
addopts = "-p no:cacheprovider"
