breaks:
- id: key
  title: A key in the model's words
  explain: 'The model''s last line now carries a string that looks like an API key. The transcript shows what the
    model said. The trace file does not: the line stored for that reply has [REDACTED] where the key was. Open trace.jsonl
    and find the model_reply line to see it.'
  change:
    script:
      path: scenarios/03_fix.json
      json:
        replies:
        - say: Let me look around first.
          tools:
          - - list_files
            - {}
        - tools:
          - - read_file
            - path: ../rein.py
        - say: That file is outside the project. Reading the code instead.
          tools:
          - - read_file
            - path: calc.py
          - - read_file
            - path: test_calc.py
