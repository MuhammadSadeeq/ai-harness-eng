  title: No continuation for a cut-off reply
  explain: Delete the four lines that ask the model to continue a reply cut off at max_tokens, and run the checkpoint.
    The run now ends at turn 4 with half a sentence reported as done. The harness mistook ran out of room for finished.
    Put the lines back.
  change:
