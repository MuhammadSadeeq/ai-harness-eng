- id: max-seconds
  title: A one-second limit on the outage
  explain: 'Run the outage script with --max-seconds 1. On the virtual clock the first turn waits 0.46 and 0.88
    seconds for its two retries, 1.34 seconds in all. The second turn would start past the one-second limit, so
    the run ends with max_time after one failed call. The breaker needs three, so it never opens: the time guard,
    not the breaker, ends this run.'
  change:
    argv:
    - Fix the failing test in calc.py
    - --fake
    - scenarios/07_outage.json
    - --mode
    - auto
    - --max-seconds
    - '1'
  expected: |
    task     Fix the failing test in calc.py
    retry    attempt 1 failed (overloaded); waiting up to 0.5s
    retry    attempt 2 failed (overloaded); waiting up to 1.0s
    error    model call failed (overloaded); breaker at 1 of 3
    max_time time limit reached: 1.3 seconds spent, the limit is 1
    trace    2 retry_wait, 1 model_error, 1 guard, 0 tokens (details in trace.jsonl)
- id: ctrl-c
  title: Ctrl+C while the edit runs
  explain: 'Simulate Ctrl+C while the edit runs: run_tool raises KeyboardInterrupt before the edit. The run stops
    with status interrupted, the pending edit gets an interrupted result, and the history stays valid. Without close_open_calls()
    the next call would be rejected.'
  change:
    patch:
      diff: |2
                 """Run one tool call. Any error becomes a message for the model, never a crash."""
        +        if call.name == "edit_file": raise KeyboardInterrupt  # simulated Ctrl+C during the edit
