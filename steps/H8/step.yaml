- id: limit-2
  title: A loop limit of two
  explain: Set the LoopDetector limit to 2. The second identical read is redirected, and the third is a call the
    model made after the redirect, so the loop guard ends the run at turn 3 with status loop. Would 2 be too strict
    for real work? Think of a model that reads a file again after editing it.
  change:
    patch:
      diff: |
        -        self.limit, self.last, self.count = limit, None, 0
        +        self.limit, self.last, self.count = 2, None, 0
  expected: |
    task     Fix the failing test in calc.py
    turn 1   model: Let me read the code.
