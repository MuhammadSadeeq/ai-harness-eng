module: H8
number: 8
title: Guards that stop the run well
goal: Give each guard its own final status, and close the books when a run is interrupted.
requires_python: '3.11'
theory: 'Chapter 10: loop state and stopping well'
lines_after: 635
size: rein.py grows to 635 lines
chunks:
- id: 8a
  title: 'Two helpers: the loop detector and the closing of open calls'
  explain: LoopDetector counts the same call in a row. close_open_calls() answers every pending tool request after
    an interrupt, so the history stays valid when the run stops.
  hunks:
  - where: above THE LOOP
    diff: |
      +# ============ GUARDS: a run ends for a reason ============
      +
      +class LoopDetector:
      +    """Notices the exact same tool call, made several times in a row."""
      +
      +    def __init__(self, limit=3):
      +        self.limit, self.last, self.count = limit, None, 0
      +
      +    def repeated(self, call):
      +        key = call.name + json.dumps(call.input, sort_keys=True)
      +        self.count = self.count + 1 if key == self.last else 1
      +        self.last = key
      +        return self.count >= self.limit
      +
      +
      +def close_open_calls(messages):
      +    """After an interrupt, every tool request still needs a result, or the history is broken."""
      +    last = messages[-1]
      +    if last["role"] == "assistant":
      +        ids = [b["id"] for b in last["content"] if b.get("type") == "tool_use"]
      +        if ids:
      +            messages.append({"role": "user", "content": [
      +                {"type": "tool_result", "tool_use_id": i, "content": "Interrupted before it ran.",
      +                 "is_error": True} for i in ids]})
      +
      +
       # ============ THE LOOP ============
