module: H11
number: 11
title: A reviewer sub-agent
goal: After the check passes, a reviewer sub-agent with a fresh context and read-only powers decides whether the
  task is truly done.
requires_python: '3.11'
theory: 'Chapter 17: many agents, and chapter 16: verification'
