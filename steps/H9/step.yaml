- id: never-passes
  title: A check that never passes
  explain: 'Make the gate''s verdict fail whatever the check prints: the patch sets passed to False. The gate sends
    the failure back at each claim, and after two fix rounds the run ends as unverified, never as done. The script
    runs out on the way, and the gate still holds.'
  change:
    patch:
      diff: |
        -        passed = output.startswith("exit code 0")  # the exit code decides: 0 passes, anything else fails
        +        passed = False  # a check that never passes
  expected: |
    task     Fix the failing test in calc.py
    turn 1   model: Let me read the code.
             tool   read_file {"path": "calc.py"}
             allow  read-only tool
             result 1| def add(a, b): | 2|     return a - b
    turn 2   model: It should multiply, I think.
             tool   edit_file {"path": "calc.py", "old_text": "return a - b", "new_text": "return a * b"
             allow  edits are allowed in auto mode
             result Edited calc.py.
    turn 3   model: Done! add() is fixed.
    check    not done: exit code 1 | test_add failed: add(2, 3) returned 6, expected 5
    turn 4   model: The check says add(2, 3) returned 6. It must add, not multiply.
             tool   edit_file {"path": "calc.py", "old_text": "return a * b", "new_text": "return a + b"
             allow  edits are allowed in auto mode
             result Edited calc.py.
    turn 5   model: Running the test myself this time.
             tool   run_command {"command": "python test_calc.py"}
             allow  allow-listed command
             result exit code 0 | 1 test passed
    turn 6   model: Fixed add() in calc.py. I ran the test and it passes.
    check    not done: exit code 0 | 1 test passed
    turn 7   model: (the script has run out)
    unverified still failing after 2 fix rounds
    trace    7 model_call, 4 permission, 4 tool_call, 3 verify, 2141 tokens (details in trace.jsonl)
