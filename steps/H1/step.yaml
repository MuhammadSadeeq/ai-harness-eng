module: H1
number: 1
title: "Talk to a model"
goal: "Send one message to a model and print its reply, with a scripted model and a real one behind the same interface."
requires_python: "3.11"  # the book says 3.10; the build needs 3.11 or newer
theory: "Chapter 3: the model has no memory"
lines_after: 105
size: "rein.py starts at 105 lines"
chunks:
  - id: "1a"
    title: "Start the file"
    explain: "Create a new file called rein.py in your build folder, and put this in it. show() prints one line of Rein's live transcript: a short tag on the left, like turn 1, then the text. Line breaks become spaces, and anything past 100 characters is cut, so the screen stays readable. The model always gets the full text. Only your view is shortened."
    hunks:
      - where: "new code"
        diff: |2
          +"""Rein: a small coding-agent harness, built one step at a time.
          +
          +Each section below is one system of the harness. Read it from top to bottom.
          +"""
          +import argparse
          +import json
          +import os
          +from dataclasses import dataclass, field
          +
          +
          +def show(tag, text):
          +    """Print one line of the live transcript: line breaks become spaces, and it is cut to fit."""
          +    print(f"{tag:<8} {' '.join(str(text).splitlines())}"[:100])
  - id: "1b"
    title: "One shape for every reply"
    explain: "Every model, fake or real, will answer in the same shape. ToolCall is one request to use a tool. Reply is one whole answer. A dataclass is a class that only holds named values; Python writes the boring parts for you. Two fields matter a lot later. stop_reason says why the model stopped: it finished, it wants tools, or it ran out of room. content keeps the reply exactly as it came."
    hunks:
      - where: "new code"
        diff: |2
               """Print one line of the live transcript: line breaks become spaces, and it is cut to fit."""
               print(f"{tag:<8} {' '.join(str(text).splitlines())}"[:100])
          +
          +
          +# ============ MODEL: one interface, two models ============
          +
          +@dataclass
          +class ToolCall:
          +    id: str      # every request gets an id, so its result can be matched to it
          +    name: str    # which tool the model wants
          +    input: dict  # the arguments the model chose
          +
          +
          +@dataclass
          +class Reply:
          +    text: str          # what the model wrote
          +    tool_calls: list   # the tools it asked for (maybe none)
          +    stop_reason: str   # why it stopped: "end_turn", "tool_use", "max_tokens", ...
          +    content: list      # the raw blocks, saved into the history exactly as they came
          +    usage: dict = field(default_factory=dict)  # input and output token counts
  - id: "1c"
    title: "A scripted model"
    explain: "The FakeModel gets a list of replies. Each call takes the next one and turns it into exactly the blocks Claude would send: a text block for what it says, and a tool_use block for each tool it asks for. It also estimates token counts, so later steps can keep a budget."
    hunks:
      - where: "new code"
        diff: |2
               content: list      # the raw blocks, saved into the history exactly as they came
               usage: dict = field(default_factory=dict)  # input and output token counts
          +
          +
          +class FakeModel:
          +    """Replays a script of replies, so every run is free, offline, and repeatable."""
          +
          +    def __init__(self, replies):
          +        self.replies = list(replies)
          +        self.calls = 0
          +
          +    def call(self, system, messages, tools):
          +        step = self.replies.pop(0) if self.replies else {"say": "(the script has run out)"}
          +        content, tool_calls = [], []
          +        if step.get("say"):
          +            content.append({"type": "text", "text": step["say"]})
          +        for name, args in step.get("tools", []):
          +            self.calls += 1
          +            call = ToolCall(f"call_{self.calls}", name, args)
          +            tool_calls.append(call)
          +            content.append({"type": "tool_use", "id": call.id, "name": name, "input": args})
          +        stop = step.get("stop") or ("tool_use" if tool_calls else "end_turn")
          +        usage = {"input_tokens": len(json.dumps(messages)) // 4,
          +                 "output_tokens": len(json.dumps(content)) // 4}
          +        return Reply(step.get("say", ""), tool_calls, stop, content, usage)
  - id: "1d"
    title: "The real model"
    explain: "ClaudeModel has exactly the same call() method, with the same inputs and the same kind of result. That is the whole point of an interface: the rest of Rein never knows, or cares, which model it is talking to. anthropic is imported inside __init__, so scripted runs work even without the package or a key. To try a different model, set the REIN_MODEL environment variable."
    hunks:
      - where: "new code"
        diff: |2
                            "output_tokens": len(json.dumps(content)) // 4}
                   return Reply(step.get("say", ""), tool_calls, stop, content, usage)
          +
          +
          +class ClaudeModel:
          +    """The real model, behind exactly the same interface."""
          +
          +    def __init__(self, model=None):
          +        import anthropic
          +        self.client = anthropic.Anthropic()  # reads your ANTHROPIC_API_KEY
          +        self.model = model or os.environ.get("REIN_MODEL", "claude-sonnet-5-5")  # facts: models.ids-current
          +
          +    def call(self, system, messages, tools):
          +        extra = {"tools": tools} if tools else {}
          +        r = self.client.messages.create(model=self.model, max_tokens=4096,
          +                                        system=system, messages=messages, **extra)
          +        content = [block.model_dump(exclude_none=True) for block in r.content]
          +        return Reply(
          +            text="".join(b["text"] for b in content if b["type"] == "text"),
          +            tool_calls=[ToolCall(b["id"], b["name"], b["input"])
          +                        for b in content if b["type"] == "tool_use"],
          +            stop_reason=r.stop_reason,
          +            content=content,
          +            usage={"input_tokens": r.usage.input_tokens,
          +                   "output_tokens": r.usage.output_tokens},
          +        )
  - id: "1e"
    title: "The command line"
    explain: "main() reads your task, picks a model (the scripted one if you pass --fake), sends one message, and prints the reply."
    hunks:
      - where: "new code"
        diff: |2
                              "output_tokens": r.usage.output_tokens},
                   )
          +
          +
          +# ============ COMMAND LINE ============
          +
          +def main():
          +    p = argparse.ArgumentParser(description="Rein: a small coding-agent harness")
          +    p.add_argument("task", help="what you want done, in plain words")
          +    p.add_argument("--fake", metavar="SCENARIO", help="use a scripted model from this JSON file")
          +    args = p.parse_args()
          +
          +    if args.fake:
          +        with open(args.fake) as f:
          +            scenario = json.load(f)
          +        model = FakeModel(scenario["replies"])
          +    else:
          +        model = ClaudeModel()
          +
          +    messages = [{"role": "user", "content": args.task}]
          +    reply = model.call("You are a helpful assistant.", messages, [])
          +    show("you", args.task)
          +    show("model", reply.text)
          +    show("", f"stop_reason={reply.stop_reason} tokens_in={reply.usage['input_tokens']} "
          +             f"tokens_out={reply.usage['output_tokens']}")
          +
          +
          +if __name__ == "__main__":
          +    main()
checkpoint:
  setup: []
  argv: ["Say hello", "--fake", "scenarios/01_hello.json"]
  expected: |2
    you      Say hello
    model    Hello! I am a scripted stand-in for Claude. I say what my script says.
             stop_reason=end_turn tokens_in=10 tokens_out=25
  explain: "Rein sent your message to the scripted model, which returned its one reply. stop_reason=end_turn means the model finished on its own, without asking for any tools. tokens_in=10 is the estimated size of what Rein sent, and tokens_out=25 the size of what came back."
breaks:
  - id: "empty-reply"
    title: "An empty reply"
    explain: "In the script, change the reply to {}, with no \"say\", and run again. The model line is empty, and nothing crashes. A harness must survive empty replies."
    change:
      script:
        path: "scenarios/01_hello.json"
        json: {"replies": [{}]}
    expected: |2
      you      Say hello
      model    
               stop_reason=end_turn tokens_in=10 tokens_out=0
  - id: "missing-file"
    title: "A missing file"
    explain: "Point --fake at a file that does not exist. Python stops with a traceback. That is fine for a typo in your own command. A harness only has to be gentle with the model's mistakes, and step 2 starts on that."
    change:
      argv: ["Say hello", "--fake", "scenarios/missing.json"]
    expected: |2
      error: FileNotFoundError
