- id: chained
  title: A chained command
  explain: Change the test command to python test_calc.py && echo ok. The gate asks instead of allowing it. The
    first answer, y, lets the edit through; the second, n, denies the chained command. A command with chaining characters
    is never on the allow-list.
  change:
    script:
      path: scenarios/04_gate.json
      json:
        replies:
        - say: First I will clean up old build files.
          tools:
          - - run_command
            - command: rm -rf build
        - say: That was denied, so I will skip the cleanup.
          tools:
          - - read_file
            - path: calc.py
        - say: Fixing the bug.
          tools:
          - - edit_file
            - path: calc.py
              old_text: return a - b
              new_text: return a + b
        - say: Running the test.
          tools:
          - - run_command
            - command: python test_calc.py && echo ok
        - say: Fixed add() in calc.py. The test passes.
  stdin:
  - y
  - n
  expected: |
    task     Fix the failing test in calc.py
    turn 1   model: First I will clean up old build files.
             tool   run_command {"command": "rm -rf build"}
