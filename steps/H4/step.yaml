- id: wall
  title: A read outside the project
  explain: 'The model asks for read_file with the path ../rein.py. The gate says allow, because read_file is read-only,
    and the wall refuses the path. The gate and the wall are separate layers: the gate decides whether a kind of
    action is allowed, and the wall, inside the tools, decides which files any action can touch.'
  change:
    script:
      path: scenarios/04_gate.json
      json:
        replies:
        - say: First I will clean up old build files.
          tools:
          - - run_command
            - command: rm -rf build
        - say: That was denied, so I will skip the cleanup.
          tools:
          - - read_file
            - path: ../rein.py
        - say: Fixing the bug.
          tools:
          - - edit_file
            - path: calc.py
              old_text: return a - b
              new_text: return a + b
        - say: Running the test.
          tools:
          - - run_command
            - command: python test_calc.py
        - say: Fixed add() in calc.py. The test passes.
  stdin:
  - y
  expected: |
    task     Fix the failing test in calc.py
    turn 1   model: First I will clean up old build files.
             tool   run_command {"command": "rm -rf build"}
             deny   destructive, network, or admin command
             error  Permission denied: destructive, network, or admin command. Do not retry this; find a
    turn 2   model: That was denied, so I will skip the cleanup.
             tool   read_file {"path": "../rein.py"}
