module: H7
number: 7
title: Retries and a breaker
goal: Wait and try again when a failure is transient, and stop with a clear status when the breaker opens.
requires_python: '3.11'
theory: 'Chapter 15: errors are the main path'
lines_after: 568
size: rein.py grows to 568 lines
chunks:
- id: 7a
  title: A clock you can skip
  explain: 'A Clock has now() and sleep(). Under --fake the clock is virtual: sleep() only moves it forward, so
    a retry that would wait eight seconds costs no time, and the run repeats exactly. With a real model, RealClock
    really waits.'
  hunks:
  - where: at the imports
    diff: |2
       import os
      +import random
       import re
  - where: above the MODEL section
    diff: |
      +# ============ CLOCK: time you can skip ============
      +
      +class RealClock:
      +    """Real time: a retry really waits. Used when Rein talks to a real model."""
      +
      +    def __init__(self):
      +        self.start = time.monotonic()
      +
      +    def now(self):
      +        return time.monotonic() - self.start
      +
      +    def sleep(self, seconds):
      +        time.sleep(seconds)
      +
      +
      +class VirtualClock:
      +    """Virtual time: sleep() only moves the clock forward, so a retry costs no waiting. Used under --fake."""
      +
      +    def __init__(self):
      +        self.t = 0.0
      +
      +    def now(self):
      +        return self.t
      +
      +    def sleep(self, seconds):
      +        self.t += seconds
      +
      +
       # ============ MODEL: one interface, two models ============
- id: 7b
  title: Teach the model to fail, and the real model to retry
  explain: 'TransientError names a failure worth retrying, and the kind the trace records it as. The FakeModel learns
    to fail: a script step with "error" raises one, and "forever": true keeps the outage going. The real model turns
    off the SDK''s own retries (max_retries=0), so the harness owns the one retry policy, and every SDK error worth
    retrying becomes a TransientError. A scripted error can carry retry_after_ms; the live path reads the retry-after
    header in seconds, and a missing or non-numeric value counts as 0.'
  hunks:
  - where: 'in the MODEL section: TransientError'
    diff: " # ============ MODEL: one interface, two models ============\n+\n+class TransientError(Exception):\n\
      +    \"\"\"A failure worth retrying. kind is one of the model_error types the trace records.\"\"\"\n+\n+ \
      \   def __init__(self, kind, message=\"\", retry_after_ms=0):\n+        super().__init__(message or kind)\n\
      +        self.kind = kind\n+        self.retry_after_ms = retry_after_ms  # the provider's retry-after in\
      \ ms; 0 when none was sent\n+\n \n @dataclass\n class ToolCall:\n"
  - where: in FakeModel.call()
    diff: |2
               step = self.replies.pop(0) if self.replies else {"say": "(the script has run out)"}
      +        if "error" in step:  # a script can pretend the API failed
      +            if step.get("forever"):  # an outage that never ends
      +                self.replies.insert(0, step)
      +            raise TransientError(step["error"], retry_after_ms=step.get("retry_after_ms", 0))
  - where: above class ClaudeModel
    diff: |
      +# SDK errors worth another try, and the trace type each one is recorded as.
      +RETRYABLE = {"RateLimitError": "rate_limit", "APIConnectionError": "api_error",
      +             "InternalServerError": "api_error", "OverloadedError": "overloaded"}
      +
      +
      +def read_retry_after(error):
      +    """The retry-after header of the error's response, in milliseconds. A missing or non-numeric value is 0."""
      +    response = getattr(error, "response", None)
      +    headers = getattr(response, "headers", None)
      +    try:
      +        return max(0, int(float(headers.get("retry-after", 0)) * 1000))
      +    except (AttributeError, TypeError, ValueError, OverflowError):
      +        return 0
      +
      +
