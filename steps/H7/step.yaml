- id: 7e
  title: Wire it in
  explain: A failed call is recorded as model_error, with the retry-after value it read; each wait is a retry_wait
    line, and the breaker's opening is a breaker line. When the breaker opens, the run ends with the status circuit_open.
    A successful call resets it.
  hunks:
  - where: in class Agent
    diff: |2
       class Agent:
      -    def __init__(self, model, cfg, trace):
      +    def __init__(self, model, cfg, trace, clock, rng):
               self.model, self.cfg, self.trace = model, cfg, trace
      +        self.clock, self.rng = clock, rng  # virtual under --fake: a retry costs no real time
      +        self.breaker = CircuitBreaker()
      +        self.attempt = 1
  - where: in Agent.finish()
    diff: |
      -        ended = {"done": "done", "stopped": "max_turns"}[status]  # the schema's status names
      +        ended = {"done": "done", "stopped": "max_turns", "circuit_open": "circuit_open"}[status]  # the schema's names
  - where: new method in class Agent
    diff: |
      +    def on_retry(self, attempt, delay, wait, error):
      +        self.attempt = attempt + 1  # the next try is the one after this
      +        if error.retry_after_ms > 0 and error.retry_after_ms / 1000 >= wait:  # retry-after set the wait
      +            text = f"attempt {attempt} failed ({error}); retry-after asks for {error.retry_after_ms / 1000:.1f}s, waiting that long"
      +        else:
      +            text = f"attempt {attempt} failed ({error}); waiting up to {delay:.1f}s"
      +        self.say("retry", text)
      +        self.trace.event("retry_wait", "errors", attempt=attempt, wait_ms=int(wait * 1000))
      +
