breaks:
- id: one-try
  title: One attempt, no retries
  explain: 'Set attempts to 1 in with_retries(). There are no retries now: every failure goes straight to the breaker.
    Three failed calls open it, and the run ends with three model_error lines and no retry_wait.'
  change:
    patch:
      diff: |
        -def with_retries(call, clock, rng, on_retry, attempts=3, base=0.5, cap=8.0):
        +def with_retries(call, clock, rng, on_retry, attempts=1, base=0.5, cap=8.0):
  expected: |
    task     Fix the failing test in calc.py
    error    model call failed (overloaded); breaker at 1 of 3
    error    model call failed (overloaded); breaker at 2 of 3
    error    model call failed (overloaded); breaker at 3 of 3
    circuit_open the model API keeps failing; the circuit breaker is open
    trace    3 model_error, 1 breaker, 0 tokens (details in trace.jsonl)
- id: rate-limit
  title: A rate limit with retry-after
  explain: The first reply is a rate limit that carries retry_after_ms 2000. Rein waits the two seconds the provider
    asked for, which is longer than its own backoff of half a second. The wait is on the virtual clock, so the run
    takes no real time.
  change:
    argv:
    - Fix the failing test in calc.py
    - --fake
    - scenarios/07_limit.json
    - --mode
    - auto
  expected: |
    task     Fix the failing test in calc.py
