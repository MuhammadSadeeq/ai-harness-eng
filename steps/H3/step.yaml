  title: The wall without resolve()
  explain: In Workspace.path(), delete .resolve() from the p = ... line and run the checkpoint again. Turn 2 now
    reads rein.py, outside the project. Without resolve(), the path still starts with the project folder's name,
    so the check passes, even though ../ climbs out of it. Put .resolve() back.
  change:
    patch:
      diff: |
        -        p = (self.root / rel).resolve()
        +        p = (self.root / rel)
  expected: |
    task     Fix the failing test in calc.py
