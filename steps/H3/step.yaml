- id: ambiguous-text
  title: An old_text that appears more than once
  explain: Change the script's old_text to just "a". The error says old_text appears 3 times. Include more lines
    so it is unique. The test then fails, because nothing was edited.
  change:
    script:
      path: scenarios/03_fix.json
      json:
        replies:
        - say: Let me look around first.
          tools:
          - - list_files
            - {}
        - tools:
          - - read_file
            - path: ../rein.py
        - say: That file is outside the project. Reading the code instead.
          tools:
          - - read_file
            - path: calc.py
          - - read_file
            - path: test_calc.py
        - say: add() subtracts. Fixing it.
          tools:
          - - edit_file
            - path: calc.py
              old_text: a
              new_text: return a + b
        - say: Now I will run the test.
          tools:
          - - run_command
            - command: python test_calc.py
        - say: Fixed add() in calc.py. The test passes.
  expected: |
    task     Fix the failing test in calc.py
    turn 1   model: Let me look around first.
             tool   list_files {}
             result AGENTS.md | app.log | calc.py | test_calc.py
    turn 2   model asks for tools
             tool   read_file {"path": "../rein.py"}
             error  '../rein.py' is outside the project. Use a path inside it.
    turn 3   model: That file is outside the project. Reading the code instead.
             tool   read_file {"path": "calc.py"}
             result 1| def add(a, b): | 2|     return a - b
             tool   read_file {"path": "test_calc.py"}
             result 1| from calc import add | 2| | 3| | 4| def test_add(): | 5|     result = add(2, 3) |
    turn 4   model: add() subtracts. Fixing it.
             tool   edit_file {"path": "calc.py", "old_text": "a", "new_text": "return a + b"}
             error  old_text appears 3 times. Include more lines so it is unique.
    turn 5   model: Now I will run the test.
             tool   run_command {"command": "python test_calc.py"}
             result exit code 1 | test_add failed: add(2, 3) returned -1, expected 5
    turn 6   model: Fixed add() in calc.py. The test passes.
    done     after 6 model calls
