module: H3
number: 3
title: Real tools inside a wall
goal: Give Rein four tools that work only inside one project folder, with errors that tell the model what to do
  next.
requires_python: '3.11'
theory: 'Chapter 11: tool design is agent UX and chapter 12: permissions and sandboxes'
lines_after: 269
size: rein.py grows to 269 lines
chunks:
- id: 3a
  title: Two imports
  explain: subprocess runs commands. Path handles file paths safely on every operating system.
  hunks:
  - where: at the top of the file
    diff: |2
       import os
      +import subprocess
       from dataclasses import dataclass, field
      +from pathlib import Path
- id: 3b
  title: The wall
  explain: Workspace.path() takes any path the model gives and turns it into a full, real path with resolve(), which
    works out every ../ and shortcut. Then it checks that the result is still inside the project folder. If it is
    not, it raises a ToolError. Its message goes back to the model, so it is written for the model. The Tool dataclass
    bundles the four things a tool needs. Its read_only flag matters in step 4.
  hunks:
  - where: new code, above read_file()
    diff: |
      +class ToolError(Exception):
      +    """An expected failure. Its message goes back to the model, so write it for the model."""
      +
      +class Workspace:
      +    """Every path goes through here, so the agent cannot leave its project folder."""
      +
      +    def __init__(self, root):
      +        self.root = Path(root).resolve()
      +
      +    def path(self, rel):
      +        p = (self.root / rel).resolve()
      +        if p != self.root and self.root not in p.parents:
      +            raise ToolError(f"'{rel}' is outside the project. Use a path inside it.")
      +        return p
      +
      +@dataclass
      +class Tool:
      +    name: str
      +    description: str         # the model reads this, so write it for the model
      +    schema: dict             # the inputs, described as JSON Schema
      +    run: object              # the Python function the harness calls
      +    read_only: bool = False  # True if the tool never changes anything
      +
      +    def spec(self):
      +        return {"name": self.name, "description": self.description, "input_schema": self.schema}
      +
      +
       def read_file(path):
- id: 3c
  title: Four tools
  explain: These replace the old read_file, so its lines turn red. list_files is where the model starts. read_file
    numbers every line and returns 200 lines at a time, and tells the model how to get the next page. edit_file
    replaces one exact piece of text, and only if it appears exactly once. run_command runs a command in the project
    folder with a 60-second timeout. CLEAN_ENV turns off Python's bytecode cache for commands, so a check never
    runs stale code.
  hunks:
  - where: new code (replaces read_file, FUNCTIONS and TOOL_SPECS)
    diff: "-def read_file(path):\n-    with open(path) as f:\n-        return f.read()\n+# Commands run without\
      \ writing .pyc caches, so a check never runs stale code.\n+CLEAN_ENV = {**os.environ, \"PYTHONDONTWRITEBYTECODE\"\
      : \"1\"}\n \n+def make_tools(ws):\n+    \"\"\"Four tools. Every error message tells the model what to do next.\"\
      \"\"\n \n-FUNCTIONS = {\"read_file\": read_file}  # tool name -> the Python function that runs it\n+    def\
      \ list_files():\n+        files = [p.relative_to(ws.root).as_posix() for p in sorted(ws.root.rglob(\"*\"))\
      \ if p.is_file()]\n+        return \"\\n\".join(f for f in files if \"__pycache__\" not in f) or \"(no files)\"\
      \n \n-TOOL_SPECS = [{                        # what the model reads about each tool\n-    \"name\": \"read_file\"\
      ,\n-    \"description\": \"Read a text file and return what is in it.\",\n-    \"input_schema\": {\"type\"\
      : \"object\",\n-                     \"properties\": {\"path\": {\"type\": \"string\", \"description\": \"\
      the file's path\"}},\n-                     \"required\": [\"path\"]},\n-}]\n+    def read_file(path, start_line=1):\n\
      +        p = ws.path(path)\n+        if not p.is_file():\n+            raise ToolError(f\"No file at '{path}'.\
      \ Call list_files to see what exists.\")\n+        lines = p.read_text().splitlines()\n+        page = lines[start_line\
      \ - 1:start_line + 199]\n+        text = \"\\n\".join(f\"{n}| {line}\" for n, line in enumerate(page, start_line))\n\
      +        last = start_line + len(page) - 1\n+        if last < len(lines):\n+            text += f\"\\n[lines\
      \ {start_line}-{last} of {len(lines)}. Call again with start_line={last + 1}.]\"\n+        return text or\
      \ \"(empty file)\"\n+\n+    def edit_file(path, old_text, new_text):\n+        p = ws.path(path)\n+      \
      \  if not p.is_file():\n+            raise ToolError(f\"No file at '{path}'. Call list_files to see what exists.\"\
      )\n+        text = p.read_text()\n+        count = text.count(old_text)\n+        if count == 0:\n+      \
      \      raise ToolError(\"old_text was not found. Read the file again: spaces must match exactly.\")\n+   \
      \     if count > 1:\n+            raise ToolError(f\"old_text appears {count} times. Include more lines so\
      \ it is unique.\")\n+        p.write_text(text.replace(old_text, new_text))\n+        return f\"Edited {path}.\"\
      \n+\n+    def run_command(command):\n+        try:\n+            r = subprocess.run(command, shell=True, cwd=ws.root,\
      \ capture_output=True,\n+                               text=True, timeout=60, env=CLEAN_ENV)\n+        except\
      \ subprocess.TimeoutExpired:\n+            raise ToolError(\"Timed out after 60 seconds. Try a smaller command.\"\
      )\n+        return f\"exit code {r.returncode}\\n{(r.stdout + r.stderr).strip() or '(no output)'}\"\n+\n+\
      \    string = {\"type\": \"string\"}\n+    tools = [\n+        Tool(\"list_files\", \"List every file in the\
      \ project. Start here.\",\n+             {\"type\": \"object\", \"properties\": {}}, list_files, read_only=True),\n\
      +        Tool(\"read_file\", \"Read a text file with line numbers, 200 lines per page.\",\n+             {\"\
      type\": \"object\", \"properties\": {\"path\": string, \"start_line\": {\"type\": \"integer\"}},\n+      \
      \        \"required\": [\"path\"]}, read_file, read_only=True),\n+        Tool(\"edit_file\", \"Replace one\
      \ exact, unique piece of text in a file. Read the file first.\",\n+             {\"type\": \"object\", \"\
      properties\": {\"path\": string, \"old_text\": string, \"new_text\": string},\n+              \"required\"\
      : [\"path\", \"old_text\", \"new_text\"]}, edit_file),\n+        Tool(\"run_command\", \"Run a shell command\
      \ in the project folder, for example the tests.\",\n+             {\"type\": \"object\", \"properties\": {\"\
      command\": string}, \"required\": [\"command\"]},\n+             run_command),\n+    ]\n+    return {t.name:\
      \ t for t in tools}\n"
- id: 3d
  title: Wire it in
  explain: 'The agent builds its tools around a Workspace. run_tool() tells three cases apart: a tool that does
    not exist (the error lists the real ones), an expected ToolError, and anything else, such as a bug or an argument
    the model made up. All three become messages for the model, never crashes. The system prompt tells the model
    where it is, and --workspace lets you point Rein at another folder.'
  hunks:
  - where: in the system prompt
    diff: |
      -SYSTEM_PROMPT = "You are Rein, a careful coding agent. Look at the files before you answer."
      +SYSTEM_PROMPT = ("You are Rein, a careful coding agent working inside one project folder. "
      +                 "Look before you change anything, and run the tests to prove your work.")
  - where: in class Config
    diff: |2
           max_turns: int = 10  # hard stop: the most model calls one run may use
      +    workspace: str = "demo"  # the only folder the agent may touch
  - where: in Agent.__init__()
    diff: |2
               self.model, self.cfg = model, cfg
      +        self.tools = make_tools(Workspace(cfg.workspace))
      +        self.specs = [t.spec() for t in self.tools.values()]
  - where: in Agent.run()
    diff: |
      -            reply = self.model.call(SYSTEM_PROMPT, messages, TOOL_SPECS)
      +            reply = self.model.call(SYSTEM_PROMPT, messages, self.specs)
  - where: in Agent.run_tool()
    diff: |2
               """Run one tool call. Any error becomes a message for the model, never a crash."""
      +        tool = self.tools.get(call.name)
      +        if tool is None:
      +            return f"Unknown tool '{call.name}'. Available tools: {', '.join(self.tools)}.", True
               try:
      -            return FUNCTIONS[call.name](**call.input), False
      -        except Exception as e:
      +            return tool.run(**call.input), False
      +        except ToolError as e:
      +            return str(e), True
      +        except Exception as e:  # a bug, or an argument the model made up
                   return f"{type(e).__name__}: {e}", True
  - where: 'in main(): the --workspace argument'
    diff: |2
           p.add_argument("--fake", metavar="SCENARIO", help="use a scripted model from this JSON file")
      +    p.add_argument("--workspace", default="demo", help="the project folder the agent works in")
  - where: 'in main(): the agent''s config'
    diff: |
      -    Agent(model, Config()).run(args.task)
      +    cfg = Config(
      +        workspace=args.workspace,
      +    )
      +    Agent(model, cfg).run(args.task)
- id: 3e
  title: Cap every tool's output
  explain: Every result is cut to tool_output_chars before it enters the context. The cut keeps the head and the
    tail, because in logs the error is usually near the end, and it says how much it removed. Errors are cut too.
    Step 6 reuses this helper.
  hunks:
  - where: new code, above make_tools()
    diff: |
      +def truncate(text, max_chars):
      +    """Keep the head and the tail. In logs, the error is usually near the end."""
      +    if len(text) <= max_chars:
      +        return text
      +    half = max_chars // 2
      +    return f"{text[:half]}\n[... {len(text) - max_chars} characters cut by the harness ...]\n{text[-half:]}"
      +
      +
       def make_tools(ws):
  - where: in class Config
    diff: |2
           workspace: str = "demo"  # the only folder the agent may touch
      +    tool_output_chars: int = 2000  # cap on each tool result that enters the context
  - where: in Agent.run_tool()
    diff: |2
               tool = self.tools.get(call.name)
               if tool is None:
      -            return f"Unknown tool '{call.name}'. Available tools: {', '.join(self.tools)}.", True
      -        try:
      -            return tool.run(**call.input), False
      -        except ToolError as e:
      -            return str(e), True
      -        except Exception as e:  # a bug, or an argument the model made up
      -            return f"{type(e).__name__}: {e}", True
      +            output, is_error = f"Unknown tool '{call.name}'. Available tools: {', '.join(self.tools)}.", True
      +        else:
      +            try:
      +                output, is_error = tool.run(**call.input), False
      +            except ToolError as e:
      +                output, is_error = str(e), True
      +            except Exception as e:  # a bug, or an argument the model made up
      +                output, is_error = f"{type(e).__name__}: {e}", True
      +        return truncate(output, self.cfg.tool_output_chars), is_error
checkpoint:
  setup:
  - reset_demo
  argv:
  - Fix the failing test in calc.py
  - --fake
  - scenarios/03_fix.json
  expected: |
    task     Fix the failing test in calc.py
    turn 1   model: Let me look around first.
             tool   list_files {}
             result AGENTS.md | app.log | calc.py | test_calc.py
    turn 2   model asks for tools
             tool   read_file {"path": "../rein.py"}
             error  '../rein.py' is outside the project. Use a path inside it.
    turn 3   model: That file is outside the project. Reading the code instead.
             tool   read_file {"path": "calc.py"}
             result 1| def add(a, b): | 2|     return a - b
             tool   read_file {"path": "test_calc.py"}
             result 1| from calc import add | 2| | 3| | 4| def test_add(): | 5|     result = add(2, 3) |
    turn 4   model: add() subtracts. Fixing it.
             tool   edit_file {"path": "calc.py", "old_text": "return a - b", "new_text": "return a + b"
             result Edited calc.py.
    turn 5   model: Now I will run the test.
             tool   run_command {"command": "python test_calc.py"}
             result exit code 0 | 1 test passed
    turn 6   model: Fixed add() in calc.py. The test passes.
    done     after 6 model calls
  explain: Six model calls, and a real bug fixed. Turn 2 tried to read a file outside the project, and the wall
    answered with an error the model could act on. Turn 3 asked for two files at once; both results went back together,
    each matched to its request by id. Turn 4 edited calc.py, turn 5 ran the test, and turn 6 finished.
breaks:
