[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rein"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The real-model path (BP-4.2): the pinned SDK (D-019). The core package keeps zero dependencies.
live = ["anthropic==1.8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rein = ["py.typed", "tooldefs.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
